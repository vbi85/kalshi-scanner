<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalshi Bot">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Kalshi Bot — Sign in</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#ededed;font:16px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:360px;text-align:center}
  img{width:84px;height:84px;border-radius:20px;border:1px solid #1d1d20}
  h1{font-size:22px;margin:14px 0 4px}
  p{color:#8a8a90;margin:0 0 22px;font-size:14px}
  input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:1px solid #2a2a2e;
        background:#0b0b0c;color:#ededed;margin-bottom:12px}
  input:focus{outline:none;border-color:#22c55e}
  button{width:100%;font:inherit;font-size:17px;font-weight:800;padding:14px;border:0;border-radius:12px;
         background:#22c55e;color:#000;cursor:pointer}
  .err{color:#ef4444;font-size:14px;margin-bottom:12px;min-height:20px}
  label{display:flex;gap:8px;align-items:center;justify-content:center;color:#8a8a90;font-size:14px;margin:4px 0 16px}
  label input{width:auto;margin:0}
</style>
</head>
<body>
<form class="box" method="post" action="/login">
  <img src="/icons/icon-192.png" alt="">
  <h1>Kalshi 15-Min Bot</h1>
  <p>Sign in to see your markets</p>
  <div class="err">{{ERROR}}</div>
  <input name="username" placeholder="Username" autocomplete="username" autocapitalize="none" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <label><input type="checkbox" name="remember" checked> Keep me signed in for 30 days</label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
